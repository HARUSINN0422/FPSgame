<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPSgame マップエディター</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c111b;color:#e8eef8}*{box-sizing:border-box}body{margin:0;padding:20px}h1{margin:0 0 6px;font-size:24px}p{color:#9eacc1}.panel{background:#151e2d;border:1px solid #2c3a50;border-radius:12px;padding:16px;margin:12px 0}.hidden{display:none!important}input,select,textarea,button{font:inherit;border-radius:7px;border:1px solid #34465e;background:#0e1724;color:#eef4ff;padding:9px}button{cursor:pointer;background:#2456a6;border:0;font-weight:650}button.secondary{background:#29364a}button.danger{background:#8b343c}label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#aebbd0}input,select,textarea{width:100%;min-width:0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}canvas{width:100%;height:auto;display:block;background:#101925;border-radius:8px;border:1px solid #34465e;touch-action:manipulation}.status{min-height:22px;color:#8ec5ff;font-size:14px}.small{font-size:12px;color:#93a3b9}@media(max-width:800px){body{padding:10px}.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<section id="login" class="panel" style="max-width:420px;margin:10vh auto"><h1>マップエディター</h1><p>管理パスワードを入力してください。</p><form id="loginForm"><label>パスワード<input id="password" type="password" autocomplete="current-password" required autofocus></label><button style="width:100%;margin-top:12px">ログイン</button><div id="loginStatus" class="status"></div></form></section>
<main id="app" class="hidden"><div class="row"><div><h1>マップエディター</h1><p>既存マップの編集と新規マップの作成。キャンバスをクリックしてオブジェクトを追加できます。</p></div><button id="logout" class="secondary" style="flex:0 0 auto">ログアウト</button></div>
<div class="panel row"><label>モード<select id="mode"><option value="Melee">乱闘（Melee）</option><option value="Area">エリア（Area）</option></select></label><label>マップ<select id="mapList"></select></label><button id="newMap">新規マップ</button><button id="loadMap" class="secondary">読み込み</button></div>
<div class="layout"><section class="panel"><canvas id="canvas" width="900" height="650"></canvas><p class="small">青い四角＝遮蔽物、黄色＝スポーン地点、緑＝坂、紫＝高台。キャンバスをクリックして配置します。</p><div class="fields"><label>配置する要素<select id="tool"><option value="obstacle">遮蔽物</option><option value="spawn">スポーン地点</option><option value="ramp">坂</option><option value="platform">高台</option></select></label><label>選択中の要素<select id="selected"></select></label></div></section>
<section class="panel"><h2 style="margin-top:0">マップ設定</h2><div class="fields">
<label>マップID<input id="id" placeholder="my-map"></label><label>表示名<input id="name" placeholder="My Map"></label><label class="full">説明<textarea id="description" rows="2"></textarea></label>
<label>回転順<input id="rotationOrder" type="number" value="10"></label><label>モードゾーン半径（Area）<input id="zoneRadius" type="number" value="8" step=".5"></label>
<label>ワールド最小X<input id="minX" type="number" value="-48"></label><label>ワールド最大X<input id="maxX" type="number" value="48"></label><label>ワールド最小Z<input id="minZ" type="number" value="-48"></label><label>ワールド最大Z<input id="maxZ" type="number" value="48"></label>
</div><hr style="border-color:#2c3a50;margin:16px 0"><h3>選択要素の位置・サイズ</h3><div class="fields">
<label>X<input id="objX" type="number" step=".5" value="0"></label><label>Z<input id="objZ" type="number" step=".5" value="0"></label>
<label>幅 W<input id="objW" type="number" step=".5" value="4"></label><label>奥行 D<input id="objD" type="number" step=".5" value="4"></label><label>高さ H<input id="objH" type="number" step=".5" value="2"></label><label>Y（スポーン）<input id="objY" type="number" step=".5" value="0"></label>
</div><div class="row" style="margin-top:12px"><button id="applyObject">選択要素に適用</button><button id="deleteObject" class="danger">選択要素を削除</button></div><div class="row" style="margin-top:16px"><button id="save">マップを保存</button><button id="refresh" class="secondary">一覧更新</button></div><div id="status" class="status"></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let maps=[],map=null,filename=null,selected={type:"",index:-1};
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"通信に失敗しました");return d}
function showApp(){ $("login").classList.add("hidden");$("app").classList.remove("hidden");refreshMaps()}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginStatus").textContent="確認中…";try{await api("../api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});showApp()}catch(e){$("loginStatus").textContent=e.message}});
$("logout").onclick=async()=>{await api("../api/admin/logout",{method:"POST",body:"{}"}).catch(()=>{});location.reload()};
async function refreshMaps(){try{const d=await api("../api/admin/maps");maps=d.maps;$("mapList").innerHTML=maps.filter(x=>x.mode===$("mode").value).map(x=>'<option value="'+x.filename+'">'+esc(x.name)+' ('+esc(x.filename)+')</option>').join("");$("status").textContent=maps.length+"件のマップ";}catch(e){$("status").textContent=e.message}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("mode").onchange=refreshMaps;$("refresh").onclick=refreshMaps;
$("loadMap").onclick=async()=>{try{const f=$("mapList").value;const d=await api("../api/admin/maps?mode="+encodeURIComponent($("mode").value)+"&file="+encodeURIComponent(f));map=d.map;filename=f;selected={type:"",index:-1};fillForm();render();$("status").textContent="読み込みました"}catch(e){$("status").textContent=e.message}};
$("newMap").onclick=()=>{map={id:"new-map",name:"新しいマップ",description:"",rotationOrder:10,world:{minX:-48,maxX:48,minZ:-48,maxZ:48},spawnPoints:[[ -36,0,-36],[36,0,36]],obstacles:[],ramps:[],elevatedPlatforms:[]};filename=null;selected={type:"",index:-1};fillForm();render();$("status").textContent="新規マップを作成中"};
function fillForm(){for(const k of ["id","name","description","rotationOrder"]){$(k).value=map[k]??""}for(const k of ["minX","maxX","minZ","maxZ"]){$(k).value=map.world[k]}$("zoneRadius").value=map.areaZone?.radius??8;updateSelection()}
function syncMeta(){map.id=$("id").value.trim();map.name=$("name").value.trim();map.description=$("description").value;map.rotationOrder=Number($("rotationOrder").value)||0;map.world={minX:Number($("minX").value),maxX:Number($("maxX").value),minZ:Number($("minZ").value),maxZ:Number($("maxZ").value)};if($("mode").value==="Area")map.areaZone={...(map.areaZone||{}),x:map.areaZone?.x??0,z:map.areaZone?.z??0,radius:Number($("zoneRadius").value)||8}}
function typeArray(type){return type==="spawn"?"spawnPoints":type==="obstacle"?"obstacles":type==="ramp"?"ramps":"elevatedPlatforms"}
function objAt(){if(!selected.type||selected.index<0)return null;return map[typeArray(selected.type)]?.[selected.index]??null}
function updateSelection(){const opts=[];for(const [type,label] of [["obstacle","遮蔽物"],["spawn","スポーン"],["ramp","坂"],["platform","高台"]]){const arr=map[typeArray(type)]||[];arr.forEach((o,i)=>opts.push({value:type+":"+i,label:label+" "+(i+1)+" (X:"+Number(o.x??o[0]??0)+", Z:"+Number(o.z??o[2]??0)+")"}))}$("selected").innerHTML='<option value="">未選択</option>'+opts.map(o=>'<option value="'+o.value+'">'+esc(o.label)+'</option>').join("");$("selected").value=selected.type?selected.type+":"+selected.index:"";const o=objAt();for(const [id,k,d] of [["objX","x",0],["objZ","z",0],["objW","w",4],["objD","d",4],["objH","h",2],["objY","y",0]])$(id).value=o?(Array.isArray(o)?(k==="x"?o[0]:k==="y"?o[1]:k==="z"?o[2]:d):(o[k]??d)):d}
$("selected").onchange=()=>{const [type,i]=($("selected").value||":-1").split(":");selected={type,index:Number(i)};updateSelection();render()};
$("canvas").onclick=e=>{syncMeta();const r=$("canvas").getBoundingClientRect(),x=Number(map.world.minX)+(e.clientX-r.left)/r.width*(map.world.maxX-map.world.minX),z=Number(map.world.minZ)+(e.clientY-r.top)/r.height*(map.world.maxZ-map.world.minZ),type=$("tool").value,arr=map[typeArray(type)];let obj=type==="spawn"?[x,0,z]:{x,z,w:4,d:4,h:2};arr.push(obj);selected={type,index:arr.length-1};updateSelection();render()};
$("applyObject").onclick=()=>{syncMeta();const o=objAt();if(!o)return;const vals={x:Number($("objX").value),z:Number($("objZ").value),w:Number($("objW").value),d:Number($("objD").value),h:Number($("objH").value),y:Number($("objY").value)};if(Array.isArray(o)){o[0]=vals.x;o[1]=vals.y;o[2]=vals.z}else Object.assign(o,vals);render();updateSelection()};
$("deleteObject").onclick=()=>{const arr=map&&typeArray(selected.type);if(!arr||selected.index<0)return;map[arr].splice(selected.index,1);selected={type:"",index:-1};updateSelection();render()};
function render(){if(!map)return;const c=$("canvas"),ctx=c.getContext("2d"),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle="#101925";ctx.fillRect(0,0,w,h);const world=map.world,px=x=>(x-world.minX)/(world.maxX-world.minX)*w,pz=z=>(z-world.minZ)/(world.maxZ-world.minZ)*h;ctx.strokeStyle="#26364a";ctx.lineWidth=1;for(let x=Math.ceil(world.minX/8)*8;x<=world.maxX;x+=8){ctx.beginPath();ctx.moveTo(px(x),0);ctx.lineTo(px(x),h);ctx.stroke()}for(let z=Math.ceil(world.minZ/8)*8;z<=world.maxZ;z+=8){ctx.beginPath();ctx.moveTo(0,pz(z));ctx.lineTo(w,pz(z));ctx.stroke()}const draw=(type,color)=>{map[typeArray(type)].forEach((o,i)=>{const x=Array.isArray(o)?o[0]:o.x,z=Array.isArray(o)?o[2]:o.z,ww=Array.isArray(o)?1:(o.w||4),dd=Array.isArray(o)?1:(o.d||4);ctx.fillStyle=color;ctx.fillRect(px(x-ww/2),pz(z-dd/2),Math.max(5,ww/(world.maxX-world.minX)*w),Math.max(5,dd/(world.maxZ-world.minZ)*h));if(selected.type===type&&selected.index===i){ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.strokeRect(px(x-ww/2),pz(z-dd/2),Math.max(5,ww/(world.maxX-world.minX)*w),Math.max(5,dd/(world.maxZ-world.minZ)*h))}})};draw("obstacle","#4287e5");draw("ramp","#39b778");draw("platform","#b77bdf");draw("spawn","#f0c34e");if(map.areaZone){ctx.strokeStyle="#ef6a6a";ctx.beginPath();ctx.arc(px(map.areaZone.x||0),pz(map.areaZone.z||0),map.areaZone.radius/(world.maxX-world.minX)*w,0,Math.PI*2);ctx.stroke()}}
$("save").onclick=async()=>{try{syncMeta();if(!map.id||!map.name)throw Error("マップIDと表示名を入力してください");if(map.spawnPoints.length===0)throw Error("スポーン地点を1つ以上配置してください");const d=await api("../api/admin/maps",{method:"POST",body:JSON.stringify({mode:$("mode").value,filename,map})});filename=d.filename;$("status").textContent="保存しました: "+filename;await refreshMaps();$("mapList").value=filename}catch(e){$("status").textContent=e.message}};
(async()=>{try{await api("../api/admin/session");showApp()}catch(_){}})();
</script></body></html>
