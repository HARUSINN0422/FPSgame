<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, orientation=landscape">
  <meta name="screen-orientation" content="landscape">
  <title>Mobile FPS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="game"></div>
  <button id="zoomResetButton" class="hidden" aria-label="ズームを元に戻す">ズーム解除</button>

  <button id="settingsButton" class="hidden" aria-label="設定">設定</button>

  <div id="settingsPanel" class="settings-overlay hidden">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>ゲーム設定</h2>
        <button id="settingsCloseButton" aria-label="設定を閉じる">閉じる</button>
      </div>

      <label class="setting-row">
        <span>視点感度 <strong id="sensitivityValue">1.00</strong></span>
        <input id="sensitivitySlider" type="range" min="0.40" max="5.00" step="0.05" value="1">
      </label>

      <div class="setting-section">
        <strong>ボタン配置</strong>
        <p>「配置を編集」を押したあと、移動スティック・JUMP・RELOAD・FIREをドラッグして移動できます。</p>
        <div class="settings-actions">
          <button id="layoutEditButton">配置を編集</button>
          <button id="layoutResetButton">配置を初期化</button>
        </div>
        <div id="layoutEditStatus" class="setting-status hidden">配置編集を開始すると設定画面が閉じます。ボタンをドラッグして動かしてください。</div>
      </div>

      <div class="settings-actions">
        <button id="settingsResetButton">設定をすべて初期化</button>
        <button id="layoutEditDoneButton" class="hidden">配置編集を完了</button>
        <button id="settingsDoneButton">完了</button>
      </div>
    </div>
  </div>

  <div id="weaponScreen" class="overlay">
    <div class="panel">
      <div class="eyebrow">ONLINE FPS</div>
      <h1>プレイヤー名と武器を選択</h1>
      <p>名前は任意です。空欄なら自動で名前を付けます。入力した名前はこの端末のCookieに保存されます。</p>
      <label class="name-label" for="playerName">プレイヤー名（任意）</label>
      <input id="playerName" class="name-input" type="text" maxlength="16" autocomplete="nickname" placeholder="空欄でもスタートできます">
      <div class="weapon-grid">
        <button class="weapon-card" data-weapon="pistol">
          <strong>ハンドガン</strong>
          <span>単発 / 34ダメージ / 中距離まで安定</span>
        </button>
        <button class="weapon-card" data-weapon="rifle">
          <strong>アサルトライフル</strong>
          <span>連射可能 / 20ダメージ / 長射程・距離減衰が小さい</span>
        </button>
        <button class="weapon-card" data-weapon="shotgun">
          <strong>ショットガン</strong>
          <span>単発 / 8発の散弾 / 近距離で高火力・距離減衰が大きい</span>
        </button>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="topHud">
      <div>HP <span id="health">100</span></div>
      <div>PLAYERS <span id="playerCount">0</span></div>
      <div>K <span id="kills">0</span> / D <span id="deaths">0</span></div>
    </div>
    <div id="crosshair">+</div>
    <div id="ammoHud">
      <span id="ammoCount">12 / 60</span>
      <button id="reloadButton" aria-label="リロード">RELOAD</button>
    </div>
    <button id="fullscreenButton" aria-label="全画面">全画面</button>
    <div id="message"></div>
  </div>

  <div id="touchUi" class="hidden">
    <div id="movePad" aria-label="360度移動スティック">
      <div id="moveKnob"></div>
    </div>

    <button id="jumpButton" aria-label="ジャンプ">JUMP</button>
    <button id="reloadTouchButton" aria-label="リロード">RELOAD</button>
    <button id="fireButton" aria-label="発射">FIRE</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="/game.js"></script>
</body>
</html>
