<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, orientation=landscape">
  <meta name="screen-orientation" content="landscape">
  <title>Mobile FPS</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="game"></div>

  <div id="weaponScreen" class="overlay">
    <div class="panel">
      <div class="eyebrow">ONLINE FPS</div>
      <h1>プレイヤー名と武器を選択</h1>
      <p>名前はこの端末のCookieに保存され、次回アクセス時にも自動入力されます。</p>
      <label class="name-label" for="playerName">プレイヤー名</label>
      <input id="playerName" class="name-input" type="text" maxlength="16" autocomplete="nickname" placeholder="名前を入力">
      <div class="weapon-grid">
        <button class="weapon-card" data-weapon="pistol">
          <strong>ハンドガン</strong>
          <span>単発 / 34ダメージ / バランス型</span>
        </button>
        <button class="weapon-card" data-weapon="rifle">
          <strong>アサルトライフル</strong>
          <span>連射可能 / 20ダメージ / 長射程</span>
        </button>
        <button class="weapon-card" data-weapon="shotgun">
          <strong>ショットガン</strong>
          <span>単発 / 8発の散弾 / 近距離で高火力</span>
        </button>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="topHud">
      <div>HP <span id="health">100</span></div>
      <div>PLAYERS <span id="playerCount">0</span></div>
      <div>K <span id="kills">0</span> / D <span id="deaths">0</span></div>
    </div>
    <div id="crosshair">+</div>
    <div id="weaponHud">
      <button id="changeWeapon">武器</button>
      <span id="weaponName">Pistol</span>
    </div>
    <button id="fullscreenButton" aria-label="全画面">全画面</button>
    <div id="message"></div>
  </div>

  <div id="touchUi" class="hidden">
    <div id="movePad" aria-label="移動">
      <button class="move-btn up" data-key="forward">▲</button>
      <button class="move-btn left" data-key="left">◀</button>
      <button class="move-btn down" data-key="back">▼</button>
      <button class="move-btn right" data-key="right">▶</button>
    </div>

    <button id="jumpButton" aria-label="ジャンプ">JUMP</button>
    <button id="fireButton" aria-label="発射">FIRE</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="/game.js"></script>
</body>
</html>
