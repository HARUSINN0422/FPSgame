<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPSgame 武器管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0c111b;color:#e8eef8}*{box-sizing:border-box}body{margin:0;padding:22px}h1{margin:0 0 6px;font-size:24px}p{color:#9eacc1}.hidden{display:none!important}.panel{background:#151e2d;border:1px solid #2c3a50;border-radius:12px;padding:18px;margin:12px 0}input,select,textarea,button{font:inherit;border-radius:7px;border:1px solid #34465e;background:#0e1724;color:#eef4ff;padding:10px;width:100%}button{cursor:pointer;background:#2456a6;border:0;font-weight:650}.secondary{background:#29364a}label{display:flex;flex-direction:column;gap:5px;color:#aebbd0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center}.row>*{width:auto}.weapon-tabs{display:flex;gap:8px;flex-wrap:wrap}.weapon-tabs button{width:auto}.weapon-tabs button.active{background:#3979d6}.status{min-height:24px;color:#8ec5ff}@media(max-width:700px){body{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.full{grid-column:1/-1}}@media(max-width:460px){.grid{grid-template-columns:1fr}}
</style></head><body>
<section id="login" class="panel" style="max-width:420px;margin:10vh auto"><h1>武器管理</h1><p>管理パスワードを入力してください。</p><form id="loginForm"><label>パスワード<input id="password" type="password" autocomplete="current-password" required autofocus></label><button style="margin-top:12px">ログイン</button><div id="loginStatus" class="status"></div></form></section>
<main id="app" class="hidden"><div class="row"><div style="flex:1"><h1>武器管理</h1><p>サーバー側の戦闘パラメータと、武器選択画面に表示する説明を編集します。</p></div><button id="logout" class="secondary">ログアウト</button></div><section class="panel"><div id="tabs" class="weapon-tabs"></div><hr style="border-color:#2c3a50;margin:16px 0"><div class="grid">
<label>武器内部名<input id="name"></label><label>胴体ダメージ<input id="damage" type="number" min="0" step=".1"></label><label>連射間隔（ms）<input id="fireInterval" type="number" min="1" step="1"></label>
<label>射程<input id="range" type="number" min="0" step=".1"></label><label>拡散率<input id="spread" type="number" min="0" step=".001"></label><label>距離減衰開始距離<input id="falloffStart" type="number" min="0" step=".1"></label>
<label>最低ダメージ倍率<input id="minDamageMultiplier" type="number" min="0" max="1" step=".01"></label><label>装弾数<input id="magazineSize" type="number" min="1" step="1"></label><label>リロード時間（ms）<input id="reloadTime" type="number" min="0" step="1"></label>
<label>散弾数（ショットガン等）<input id="pellets" type="number" min="1" step="1" placeholder="未設定可"></label><label>連射方式<select id="automatic"><option value="true">連射可能</option><option value="false">単発</option></select></label>
<label class="full" style="grid-column:1/-1">武器選択画面の説明<textarea id="description" rows="3"></textarea></label></div><div class="row" style="margin-top:16px"><button id="save">変更を保存</button><button id="reload" class="secondary">サーバー設定を再読み込み</button></div><div id="status" class="status"></div><p style="font-size:12px">連射間隔は小さいほど速くなります（例：100ms = 1秒あたり約10発）。変更内容はサーバーに保存され、以後の戦闘計算に使用されます。</p></section></main>
<script>
const $=id=>document.getElementById(id);let weapons={},current="pistol";
async function api(url,options={}){const r=await fetch(url,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"通信に失敗しました");return d}
$("loginForm").onsubmit=async e=>{e.preventDefault();$("loginStatus").textContent="確認中…";try{await api("../api/admin/login",{method:"POST",body:JSON.stringify({password:$("password").value})});showApp()}catch(e){$("loginStatus").textContent=e.message}};
$("logout").onclick=async()=>{await api("../api/admin/logout",{method:"POST",body:"{}"}).catch(()=>{});location.reload()};
function showApp(){$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}
async function load(){try{weapons=(await api("../api/admin/weapons")).weapons;$("tabs").innerHTML=Object.entries(weapons).map(([id,w])=>'<button type="button" data-id="'+id+'" class="'+(id===current?"active":"")+'">'+w.label+'</button>').join("");$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{saveFormToLocal();current=b.dataset.id;fill();highlight()});fill();$("status").textContent="武器設定を読み込みました"}catch(e){$("status").textContent=e.message}}
function highlight(){$("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.id===current))}
function fill(){const w=weapons[current];if(!w)return;for(const k of ["name","damage","fireInterval","range","spread","falloffStart","minDamageMultiplier","magazineSize","reloadTime","pellets","description"])$(k).value=w[k]??"";$("automatic").value=String(w.automatic!==false)}
function saveFormToLocal(){const w=weapons[current];if(!w)return;for(const k of ["name","description"])w[k]=$(k).value;for(const k of ["damage","fireInterval","range","spread","falloffStart","minDamageMultiplier","magazineSize","reloadTime","pellets"]){if($(k).value===""){delete w[k]}else w[k]=Number($(k).value)}w.automatic=$("automatic").value==="true"}
$("save").onclick=async()=>{try{saveFormToLocal();const d=await api("../api/admin/weapons",{method:"POST",body:JSON.stringify({weapons})});weapons=d.weapons;fill();$("status").textContent="保存しました。戦闘パラメータは即時反映されます。"}catch(e){$("status").textContent=e.message}};
$("reload").onclick=load;
(async()=>{try{await api("../api/admin/session");showApp()}catch(_){}})();
</script></body></html>
